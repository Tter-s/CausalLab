name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: backend
        run: uv sync --frozen

      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests

      - name: Mypy
        working-directory: backend
        run: uv run mypy app

      - name: Pytest
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: 前端构建、单测与 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Vitest
        working-directory: frontend
        run: npx vitest run

      - name: Next 构建
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: E2E（Playwright + Chromium）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装后端依赖
        working-directory: backend
        run: uv sync --frozen

      - name: 安装前端依赖与 Playwright 浏览器
        working-directory: frontend
        run: |
          npm ci
          # CI 使用 Playwright 自带 Chromium；本机开发用系统 Edge（见 playwright.config.ts）
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=0 npx playwright install --with-deps chromium

      - name: 运行 E2E（CI 用 Chromium channel）
        working-directory: frontend
        run: npx playwright test
        env:
          # playwright.config.ts 读取的是 PLAYWRIGHT_CHANNEL（默认 msedge，供本机使用）；
          # CI 无 Edge，必须覆盖为 chromium（上一步已安装 Chromium）。
          PLAYWRIGHT_CHANNEL: chromium

# 说明：
# - 本 workflow 在 GitHub Actions 上真实运行过一次都没有（本机无 Docker、无法执行 act），
#   属于【未在本机验证】项。语法按官方 Action 与 Playwright 文档编写。
# - 注意：playwright.config.ts 的 projects 里只有一个名为 "edge" 的 project，
#   channel 由环境变量 PLAYWRIGHT_CHANNEL 控制，因此**不能**写 `--project=chromium`
#   （会报 Project(s) 'chromium' not found），也不存在 PLAYWRIGHT_CHROMIUM 这个变量名。
