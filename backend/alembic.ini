[alembic]
script_location = alembic
prepend_sys_path = .
# Declare the separator explicitly; otherwise Alembic falls back to splitting on
# spaces/commas/colons and emits a DeprecationWarning.
# NOTE: keep this file strictly ASCII. Alembic reads it with encoding="locale"
# (GBK on this machine), so any non-ASCII byte raises UnicodeDecodeError and the
# startup migration silently degrades to Base.metadata.create_all().
path_separator = os
# Real DB URL is resolved at runtime from app.config / CAUSALAB_DB_URL (see alembic/env.py)
sqlalchemy.url = sqlite:///data/causalab.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
